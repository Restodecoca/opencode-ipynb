name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js for pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pyright
        run: npm install -g pyright@1.1.414

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -r python/requirements-test.txt

      - name: Lint the Python helper
        run: |
          python -m pip install ruff==0.17.5
          python -m ruff check --select F,E9 python/

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Test with coverage
        env:
          SKIP_LOCK_BENCH: "1"
        run: |
          set -o pipefail
          attempt=1
          status=1
          while [ "$attempt" -le 3 ]; do
            set +e
            bun test --coverage > "test-run-$attempt.log" 2>&1
            run_status=$?
            set -e
            cat "test-run-$attempt.log"
            if [ "$run_status" -eq 0 ]; then
              status=0
              break
            fi
            status=1
            if grep -qE '\(fail\)' "test-run-$attempt.log"; then
              echo "::error::test failures on attempt $attempt"
              grep -E '\(fail\)' "test-run-$attempt.log" || true
            fi
            attempt=$((attempt + 1))
          done
          cp "test-run-$attempt.log" coverage.txt
          grep -E 'All files' "test-run-$attempt.log" > coverage-summary.txt || true
          awk -F'|' '/All files/ { found=1; gsub(/ /,"",$3); if ($3+0 < 80) { print "Line coverage below 80%"; exit 1 } } END { if (!found) { print "Coverage summary not found"; exit 2 } }' coverage-summary.txt
          exit "$status"

      - name: Upload coverage and every test attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage-summary.txt
            test-run-*.log
          if-no-files-found: warn

      - name: Write scaling benchmark
        run: bun run scripts/bench-writes.ts

      - name: Build
        run: bun run build

      - name: Package dry run
        run: npm pack --dry-run

  formal:
    name: TLA+ models and Lean proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for TLC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install TLA+ tools
        run: |
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_JAR=$PWD/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          auto-config: false
          build: true
          use-github-cache: false

      - name: Verify
        run: ./scripts-verify.sh

  windows-typecheck:
    name: Windows typecheck and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Test
        run: bun test

  macos:
    name: macOS typecheck and tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Test
        run: bun test
